/* ════════════════════════════════════════════════════════════
   INTERACTIONS : défilement, curseur, apparitions, easter egg
   ════════════════════════════════════════════════════════════ */

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t;

/* ── barre de progression + état du haut de page ─────────── */
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    const max = document.body.scrollHeight - innerHeight;
    document.documentElement.style.setProperty('--sp', (max > 0 ? (y / max) * 100 : 0).toFixed(2) + '%');
    document.body.classList.toggle('at-top', y < 12);
    $('.hdr').classList.toggle('scrolled', y > 12);
    parallax();
    ticking = false;
  });
}

/* ── parallaxe ───────────────────────────────────────────── */
let PX = [];
function collectParallax() {
  PX = $$('[data-px]').map(el => ({ el, s: Number(el.dataset.px) || 0.06 }));
}
function parallax() {
  if (REDUCED || !M()) return;
  const h = innerHeight;
  for (const { el, s } of PX) {
    const r = el.getBoundingClientRect();
    if (r.bottom < -200 || r.top > h + 200) continue;
    const d = (r.top + r.height / 2 - h / 2) / h;
    el.style.transform = `translate3d(0, ${(-d * s * 100 * M()).toFixed(2)}px, 0)`;
  }
}
const M = () => (D.theme.motion == null ? 1 : Number(D.theme.motion));

/* ── apparitions ─────────────────────────────────────────── */
let IO = null;
function setupReveal() {
  if (IO) IO.disconnect();
  if (EDIT || REDUCED || !M()) { $$('[data-rv]').forEach(e => e.classList.add('in')); return; }
  IO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); IO.unobserve(e.target); }
  }), { rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
  $$('[data-rv]').forEach(e => IO.observe(e));
}

/** Prépare les apparitions : sections, puis enfants en cascade. */
function markReveal() {
  if (EDIT) return;
  $$('#app > section, #app > .marq').forEach(sec => {
    sec.setAttribute('data-rv', '');
    const kids = sec.querySelectorAll('.cols > *, .index-list > *, .kv > div, .stack > *');
    let i = 0;
    kids.forEach(k => {
      if (k.closest('[data-rv]') !== sec) return;
      k.setAttribute('data-rv', '');
      k.style.setProperty('--rvd', Math.min(i++, 8) * 55 * M() + 'ms');
    });
  });
  $$('figure .fig').forEach(f => { if (!f.dataset.px) f.dataset.px = '0.05'; });
  collectParallax();
}

/** Découpe les grands titres en mots pour les faire monter un par un. */
function splitTitles() {
  if (EDIT || REDUCED || !M()) return;
  $$('#app .d0, #app .d1').forEach(el => {
    if (el.dataset.split || el.hasAttribute('contenteditable')) return;
    const words = el.textContent.split(/(\s+)/);
    el.dataset.split = '1';
    el.innerHTML = words.map((w, i) => /^\s+$/.test(w) ? ' '
      : `<span class="wr"><i style="--d:${Math.min(i * 42, 620) * M()}ms">${esc(w)}</i></span>`).join('');
    const sec = el.closest('section');
    if (sec) sec.setAttribute('data-rv', '');
  });
}

/* ── chiffres qui montent ────────────────────────────────── */
function setupCounters() {
  if (EDIT || REDUCED || !M()) return;
  $$('#app .d1').forEach(el => {
    const raw = el.textContent.trim();
    if (!/^\d{1,6}$/.test(raw) || !el.closest('.cols')) return;
    const target = Number(raw);
    // une année ne s'incrémente pas : ça n'a aucun sens à l'écran
    if (raw.length === 4 && target >= 1900 && target <= 2100) return;
    el.classList.add('stat-num');
    el.textContent = '0';
    const obs = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      obs.disconnect();
      const dur = 1100 * M(), t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }), { threshold: 0.4 });
    obs.observe(el);
  });
}

/* ── halo de curseur ─────────────────────────────────────── */
let curX = innerWidth / 2, curY = innerHeight / 2, tgX = curX, tgY = curY, curRAF = null;
function setupCursor() {
  if (REDUCED || matchMedia('(hover:none)').matches) return;
  document.body.classList.add('has-cursor');
  const el = $('#cursor');
  addEventListener('pointermove', e => {
    tgX = e.clientX; tgY = e.clientY;
    document.documentElement.style.setProperty('--mx', e.clientX + 'px');
    document.documentElement.style.setProperty('--my', e.clientY + 'px');
    const hot = e.target.closest('a,button,.artist,.pcard,.index-list a,[data-edit]');
    el.dataset.hot = hot ? '1' : '0';
  }, { passive: true });
  if (curRAF) cancelAnimationFrame(curRAF);
  (function loop() {
    curX = lerp(curX, tgX, 0.16); curY = lerp(curY, tgY, 0.16);
    el.style.transform = `translate3d(${curX}px, ${curY}px, 0) translate(-50%, -50%)`;
    curRAF = requestAnimationFrame(loop);
  })();
}

/* ── aimantation des boutons ─────────────────────────────── */
function setupMagnet() {
  if (REDUCED || !M()) return;
  $$('#app .btn, .hdr .btn').forEach(b => {
    if (b.dataset.mag) return;
    b.dataset.mag = '1';
    b.addEventListener('pointermove', e => {
      const r = b.getBoundingClientRect();
      const dx = (e.clientX - r.left - r.width / 2) / r.width;
      const dy = (e.clientY - r.top - r.height / 2) / r.height;
      b.style.transform = `translate3d(${(dx * 7 * M()).toFixed(1)}px, ${(dy * 5 * M()).toFixed(1)}px, 0)`;
    });
    b.addEventListener('pointerleave', () => { b.style.transform = ''; });
  });
}

/* ── transition de page ──────────────────────────────────── */
function navTransition(fn) {
  if (REDUCED || !M()) { fn(); return; }
  document.body.dataset.nav = 'out';
  setTimeout(() => { fn(); document.body.dataset.nav = 'in'; }, 200);
}

   EASTER EGG : taper « vibes » débloque le code promo
   ════════════════════════════════════════════════════════════ */
const EGG_WORD = 'vibes';
const EGG_CODE = 'NOLIMIT10';
let eggBuf = '', EGG_FOUND = false;

function eggPromo() {
  return (D.shop.promos || []).find(p => p.code.toUpperCase() === EGG_CODE);
}
function unlockEgg() {
  if (EGG_FOUND) return;
  EGG_FOUND = true;
  const p = eggPromo();
  const pct = p ? p.value : 10;
  $('#eggPct').textContent = pct + ' %';
  $('#eggCode').textContent = EGG_CODE;
  $('#egg').dataset.on = '1';
  paintCart();
}
function bindEgg() {
  addEventListener('keydown', e => {
    if (EDIT) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key.length !== 1) return;
    eggBuf = (eggBuf + e.key.toLowerCase()).slice(-EGG_WORD.length);
    if (eggBuf === EGG_WORD) { eggBuf = ''; unlockEgg(); }
  });
  $('#eggClose').onclick = () => $('#egg').dataset.on = '0';
  $('#egg').addEventListener('click', e => { if (e.target.id === 'egg') $('#egg').dataset.on = '0'; });
  $('#eggCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(EGG_CODE); $('#eggCopy').textContent = 'Copié'; }
    catch { $('#eggCopy').textContent = 'Sélectionne le code'; }
    setTimeout(() => $('#eggCopy').textContent = 'Copier le code', 1900);
  };
  $('#eggShop').onclick = () => { $('#egg').dataset.on = '0'; location.hash = '#/shop'; };
}

function enhance() {

/* ════════════════════════════════════════════════════════════
   COMPOSANTS INTERACTIFS
   ════════════════════════════════════════════════════════════ */

/* ── l'en-tête prend la couleur de la section qu'il survole ── */
let HDR_IO = null;
function setupHeaderTone() {
  if (HDR_IO) HDR_IO.disconnect();
  const zones = $$('#app [data-tone]');
  if (!zones.length) { document.body.dataset.hdr = 'dark'; return; }
  const h = $('.hdr').offsetHeight || 68;
  const pick = () => {
    let cur = 'dark';
    for (const z of zones) {
      const r = z.getBoundingClientRect();
      if (r.top <= h * 0.6 && r.bottom > h * 0.6) cur = z.dataset.tone;
    }
    document.body.dataset.hdr =
      (cur === 'light' || cur === 'paper') ? 'light' :
      (cur === 'yellow' || cur === 'yellow-soft') ? 'yellow' : 'dark';
  };
  pick();
  HDR_IO = { disconnect() { removeEventListener('scroll', pick); } };
  addEventListener('scroll', pick, { passive: true });
}

/* ── carrousel : glisser, flèches, molette, barre d'avancée ── */
function setupRails() {
  $$('[data-rail-track]').forEach(rail => {
    if (rail.dataset.ready) return;
    rail.dataset.ready = '1';
    const wrap = rail.closest('.rail-wrap');
    const bar = wrap && wrap.querySelector('.rail-bar i');
    const sec = rail.closest('section');
    const step = () => Math.max(220, rail.clientWidth * 0.62);

    const progress = () => {
      if (!bar) return;
      const max = rail.scrollWidth - rail.clientWidth;
      const w = Math.max(12, (rail.clientWidth / rail.scrollWidth) * 100);
      bar.style.setProperty('--w', w + '%');
      bar.style.setProperty('--x', max > 0 ? `${(rail.scrollLeft / max) * (100 / w * 100 - 100)}%` : '0%');
    };
    rail.addEventListener('scroll', progress, { passive: true });
    progress();

    if (sec) sec.querySelectorAll('[data-rail]').forEach(b => b.onclick = () =>
      rail.scrollBy({ left: Number(b.dataset.rail) * step(), behavior: REDUCED ? 'auto' : 'smooth' }));

    let down = false, sx = 0, sl = 0, moved = 0;
    rail.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      down = true; moved = 0; sx = e.clientX; sl = rail.scrollLeft;
      rail.classList.add('drag'); rail.setPointerCapture(e.pointerId);
    });
    rail.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - sx;
      moved = Math.max(moved, Math.abs(dx));
      rail.scrollLeft = sl - dx;
    });
    const up = () => { down = false; rail.classList.remove('drag'); };
    rail.addEventListener('pointerup', up);
    rail.addEventListener('pointercancel', up);
    rail.addEventListener('click', e => { if (moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
  });
}

/* ════════════════════════════════════════════════════════════
   PUBLICATION EN LIGNE
   Sans ce réglage, le contenu vient du fichier lui-même et il
   faut le repartager à chaque modification. Avec, le contenu
   est lu à chaque ouverture depuis une adresse : tout le monde
   voit la dernière version en rouvrant simplement le lien.
   La clé d'écriture n'est JAMAIS enregistrée dans le fichier :
   elle est demandée à chaque session d'édition.
   ════════════════════════════════════════════════════════════ */

const SYNC = { key: '', lastFetch: null, state: 'off' };

const syncCfg = () => (D.sync = D.sync || { provider: '', getUrl: '', putUrl: '', method: 'PUT', headerName: '', headerPrefix: '', owner: '', repo: '', branch: 'main', path: 'vibes-data.json' });
const syncOn = () => { const c = syncCfg(); return c.provider === 'github' ? Boolean(c.owner && c.repo) : Boolean(c.getUrl); };

/** Adresse publique de lecture, selon le service choisi. */
function readUrl() {
  const c = syncCfg();
  if (c.provider === 'github') {
    return `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch || 'main'}/${c.path || 'vibes-data.json'}`;
  }
  return c.getUrl;
}

/** Encodage du contenu pour GitHub, qui attend du base64. */
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode(...bytes.subarray(i, i + CH));
  return btoa(bin);
}

/** Écriture sur GitHub : on récupère l'empreinte du fichier existant, puis on l'écrase. */
async function pushGithub() {
  const c = syncCfg();
  const api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path || 'vibes-data.json'}`;
  const auth = { Authorization: 'Bearer ' + SYNC.key, Accept: 'application/vnd.github+json' };

  let sha = null;
  const head = await fetch(`${api}?ref=${c.branch || 'main'}`, { headers: auth, cache: 'no-store' });
  if (head.ok) sha = (await head.json()).sha;
  else if (head.status !== 404) {
    throw new Error(head.status === 401 ? 'jeton refusé' : 'lecture impossible (' + head.status + ')');
  }

  const r = await fetch(api, {
    method: 'PUT', headers: { ...auth, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: `Site mis à jour par ${D.meta.lastEditor || 'un éditeur'} (version ${D.meta.version})`,
      content: toBase64(JSON.stringify(D)),
      branch: c.branch || 'main',
      ...(sha ? { sha } : {})
    })
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(r.status === 401 ? 'jeton refusé'
      : r.status === 404 ? 'dépôt introuvable, vérifie le propriétaire et le nom'
      : r.status === 403 ? 'le jeton n’a pas le droit d’écrire dans ce dépôt'
      : `${r.status} ${t.slice(0, 120)}`);
  }
}

/** Certains services enveloppent la donnée : on va la chercher où qu'elle soit. */
function unwrap(j) {
  if (!j || typeof j !== 'object') return null;
  if (j.pages) return j;
  for (const k of ['record', 'data', 'value', 'content', 'json']) {
    if (j[k] && typeof j[k] === 'object') {
      const inner = unwrap(j[k]);
      if (inner) return inner;
    }
  }
  return null;
}

async function loadRemote({ silent = true } = {}) {
  const cfg = syncCfg();
  const base = readUrl();
  if (!base) { SYNC.state = 'off'; return false; }
  SYNC.state = 'loading';
  try {
    const url = base + (base.includes('?') ? '&' : '?') + '_=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('réponse ' + r.status);
    const j = unwrap(await r.json());
    if (!j) throw new Error('contenu illisible');
    const localV = (D.meta || {}).version || 0;
    const remoteV = (j.meta || {}).version || 0;
    D = j;
    SYNC.state = 'ok';
    SYNC.lastFetch = new Date();
    if (!silent) toast(`Contenu en ligne chargé (version ${remoteV || '?'}${remoteV < localV ? ', plus ancien que le fichier' : ''}).`);
    return true;
  } catch (e) {
    SYNC.state = 'error';
    SYNC.error = e.message;
    if (!silent) alert('Lecture en ligne impossible : ' + e.message);
    console.warn('[vibes] lecture en ligne impossible :', e.message);
    return false;
  }
}

async function saveOnline() {
  const cfg = syncCfg();
  const github = cfg.provider === 'github';
  if (!github && !cfg.putUrl) { alert('Aucune adresse d’écriture n’est configurée, onglet En ligne.'); return false; }
  if (github && (!cfg.owner || !cfg.repo)) { alert('Renseigne le propriétaire et le nom du dépôt, onglet En ligne.'); return false; }
  if ((github || cfg.headerName) && !SYNC.key) {
    const k = prompt(github
      ? 'Colle ton jeton GitHub (il n’est jamais enregistré dans le fichier) :'
      : 'Clé d’écriture (elle n’est jamais enregistrée dans le fichier) :');
    if (!k) return false;
    SYNC.key = k.trim();
  }
  D.meta = D.meta || {};
  D.meta.version = (D.meta.version || 0) + 1;
  D.meta.lastEditor = EDITOR_NAME || D.meta.lastEditor || '';
  D.meta.lastSaved = new Date().toISOString();

  const headers = { 'Content-Type': 'application/json' };
  if (cfg.headerName && SYNC.key) headers[cfg.headerName] = (cfg.headerPrefix || '') + SYNC.key;

  try {
    if (github) await pushGithub();
    else {
      const r = await fetch(cfg.putUrl, { method: cfg.method || 'PUT', headers, body: JSON.stringify(D) });
      if (!r.ok) throw new Error('réponse ' + r.status + ' ' + (await r.text()).slice(0, 120));
    }
    setDirty(false);
    const st = $('#edVersion'); if (st) st.textContent = frStamp() + ' · en ligne';
    toast(`Publié en ligne, version ${D.meta.version}. Il suffit de rouvrir le lien.`);
    return true;
  } catch (e) {
    D.meta.version -= 1;
    alert('Publication impossible : ' + e.message +
      '\n\nVérifie l’adresse d’écriture et la clé, onglet Partage.');
    return false;
  }
}

/* ════════════════════════════════════════════════════════════
   ÉDITEUR
   ════════════════════════════════════════════════════════════ */
let EDIT = false;
let TAB = 'contenu';

function setDirty(v) {
  DIRTY = v;
  const st = $('#edState');
  if (st) { st.dataset.dirty = v ? '1' : '0'; st.textContent = v ? 'Modifications non enregistrées' : 'À jour'; }
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.dataset.on = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.dataset.on = '0', 2400);
}
function getPath(path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), { pages: pagesIndex(), theme: D.theme, meta: D.meta });
}
/** Index des pages par identifiant de bloc, pour résoudre « pages.slug.blocId.d.champ ». */
function pagesIndex() {
  const out = {};
  for (const [slug, blocks] of Object.entries(D.pages)) {
    out[slug] = {};
    for (const b of blocks) out[slug][b.id] = b;
  }
  return out;
}
function setPath(path, value) {
  const parts = path.split('.');
  const root = { pages: pagesIndex(), theme: D.theme, meta: D.meta };
  let o = root;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    if (o[k] == null) o[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    o = o[k];
  }
  o[parts[parts.length - 1]] = value;
  setDirty(true);
}

function bindInline() {
  if (!EDIT) return;
  $$('[data-edit]').forEach(el => {
    if (!el.textContent.trim() && el.dataset.ph) el.textContent = '';
    el.addEventListener('focus', () => { if (el.dataset.ph && !el.textContent.trim()) el.textContent = ''; });
    el.addEventListener('blur', () => {
      setPath(el.dataset.edit, el.textContent.trim());
      if (!el.textContent.trim() && el.dataset.ph) el.textContent = '';
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); } });
  });
  $$('[data-blk-act]').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const slug = currentSlug(), list = D.pages[slug], i = list.findIndex(x => x.id === b.dataset.id);
    const act = b.dataset.blkAct;
    if (act === 'up' && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
    if (act === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
    if (act === 'hide') list[i].visible = !list[i].visible;
    if (act === 'del' && confirm('Supprimer ce bloc ?')) list.splice(i, 1);
    if (act === 'edit') { TAB = 'contenu'; EDITING_BLOCK = b.dataset.id; openPanel(); }
    setDirty(true); render();

}

/* ── images : redimensionnées avant d'être intégrées au fichier ── */
function readImage(file, maxPx = 1800, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (file.type.startsWith('video/')) {
      if (file.size > 9e6) return reject(new Error('Vidéo trop lourde (9 Mo maximum). Utilise plutôt un lien YouTube ou Instagram.'));
      const fr = new FileReader();
      fr.onload = () => resolve({ src: fr.result, kind: 'video', portrait: true });
      fr.onerror = reject; fr.readAsDataURL(file);
      return;
    }
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const r = Math.min(1, maxPx / Math.max(w, h));
        w = Math.round(w * r); h = Math.round(h * r);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ src: cv.toDataURL('image/jpeg', quality), kind: 'photo', portrait: h > w });
      };
      img.onerror = reject; img.src = fr.result;
    };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}
function pickFiles(cb, accept = 'image/*,video/mp4,video/webm') {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.multiple = true;
  inp.onchange = async () => {
    for (const f of inp.files) {
      try { cb(await readImage(f), f); } catch (e) { alert(e.message); }
    }
    setDirty(true); render(); paintPanel();
  };
  inp.click();
}

  if (dz) {
    dz.onclick = () => pickFiles(r => D.media.push({ id: uid('m'), kind: r.kind, src: r.src,
      portrait: r.portrait, title: '', album: '', credit: '', alt: '', visible: true }));
    ['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', async e => {
      for (const file of e.dataTransfer.files) {
        try {
          const r = await readImage(file);
          D.media.push({ id: uid('m'), kind: r.kind, src: r.src, portrait: r.portrait,
            title: file.name.replace(/\.[^.]+$/, ''), album: '', credit: '', alt: '', visible: true });
        } catch (err) { alert(err.message); }
      }
      setDirty(true); render(); paintPanel();
    });
  }
  $('#edBody').querySelectorAll('[data-h]').forEach(el => {
    const h = window['_h_' + el.dataset.h];
    if (el.tagName === 'BUTTON') el.onclick = h;
    else if (el.type === 'checkbox') el.onchange = () => { h(el.checked); setDirty(true); };
    else el.oninput = () => { h(el.value); setDirty(true); };
  });
}

function tabContenu() {
  const slug = currentSlug();
  const list = D.pages[slug] || [];
  if (ADDING) {
    return `<div class="ed-note">Choisis le type de bloc à ajouter à la page <b>${esc(D.nav.find(n => n.slug === slug)?.label || 'Accueil')}</b>.</div>`
      + Object.entries(KINDS).map(([k, l]) => btn(l, () => {
        list.push({ id: uid('b'), kind: k, visible: true, bg: '', d: defaultsFor(k) });
        ADDING = false; setDirty(true); render(); paintPanel();
      })).join(' ')
      + `<div style="margin-top:16px">${btn('Annuler', () => { ADDING = false; paintPanel(); })}</div>`;
  }
  if (EDITING_BLOCK) {
    const b = list.find(x => x.id === EDITING_BLOCK);
    if (!b) { EDITING_BLOCK = null; return tabContenu(); }
    return `<div class="ed-note">Réglages du bloc <b>${esc(KINDS[b.kind])}</b>. Les textes se modifient
      directement sur la page, en cliquant dessus.</div>`
      + sel('Peau de la section', b.tone || 'dark', TONES, v => { b.tone = v; render(); })
      + sel('Alignement', b.align || 'left', [['left', 'À gauche'], ['center', 'Centré']], v => { b.align = v; render(); })
      + chk('Colonne étroite, texte plus resserré', b.narrow, v => { b.narrow = v; render(); })
      + chk('Masquer le numéro en marge', b.noIdx, v => { b.noIdx = v; render(); })
      + f('Espacement de la section', b.pad || 1, v => { b.pad = Number(v) || 1; render(); }, 'number', '1 = normal, 0.6 = serré, 1.6 = aéré')
      + blockExtras(b, slug)
      + `<div style="margin-top:16px">${btn('Retour', () => { EDITING_BLOCK = null; paintPanel(); })}</div>`;
  }
  return `<div class="ed-note">Tu es sur la page <b>${esc(D.nav.find(n => n.slug === slug)?.label || 'Accueil')}</b>.
    Clique sur n’importe quel texte de la page pour le modifier. Survole un bloc pour le déplacer ou le supprimer.</div>`
    + `<h4>Blocs de cette page</h4>`
    + list.map((b, i) => `<div class="ed-item"><div class="t">
        <b>${esc(KINDS[b.kind] || b.kind)}</b>
        <span class="k">${b.visible ? '' : 'masqué'}</span>
        ${btn('Réglages', () => { EDITING_BLOCK = b.id; paintPanel(); }, 'sm')}
      </div></div>`).join('')
    + `<div style="margin-top:12px">${btn('+ Ajouter un bloc', () => { ADDING = true; paintPanel(); }, 'p')}</div>`
    + `<h4>Pages du site</h4>`
    + D.nav.map(n => `<div class="ed-item"><div class="t"><b>${esc(n.label)}</b>
        ${chk('Menu', n.inNav, v => { n.inNav = v; render(); })}
        ${btn('Ouvrir', () => { location.hash = '#/' + n.slug; }, 'sm')}</div></div>`).join('');
}

/** Réglages supplémentaires selon le type de bloc. */
function blockExtras(b, slug) {
  const d = b.d;
  const listEditor = (key, fields, label) => `<h4>${label}</h4>` +
    (d[key] || []).map((it, i) => `<div class="ed-item"><div class="t">
        <b>${esc(it[fields[0]] || '(vide)')}</b>
        ${btn('↑', () => { if (i > 0) { [d[key][i - 1], d[key][i]] = [d[key][i], d[key][i - 1]]; render(); paintPanel(); } }, 'sm')}
        ${btn('✕', () => { d[key].splice(i, 1); render(); paintPanel(); }, 'sm d')}
      </div></div>`).join('') +
    btn('+ Ajouter', () => { d[key].push(Object.fromEntries(fields.map(k => [k, '']))); render(); paintPanel(); });

  switch (b.kind) {
    case 'hero': case 'cta':
      return `<h4>Boutons</h4>` + (d.actions || []).map((a, i) =>
        `<div class="ed-item">${f('Texte du bouton', a.label, v => { a.label = v; render(); })}
          ${f('Adresse', a.url, v => { a.url = v; render(); })}
          ${btn('Supprimer', () => { d.actions.splice(i, 1); render(); paintPanel(); }, 'sm d')}</div>`).join('')
        + btn('+ Ajouter un bouton', () => { (d.actions = d.actions || []).push({ label: '', url: '' }); render(); paintPanel(); });
    case 'columns': return listEditor('items', ['title', 'text'], 'Encarts');
    case 'stats': return listEditor('items', ['value', 'label'], 'Chiffres');
    case 'timeline': return listEditor('items', ['date', 'title', 'text'], 'Entrées');
    case 'faq': return listEditor('items', ['q', 'a'], 'Questions');
    case 'prose': case 'feature':
      return `<h4>Paragraphes</h4>` + (d.paragraphs || []).map((t, i) =>
        `<div class="ed-item"><div class="t"><b>Paragraphe ${i + 1}</b>
          ${btn('✕', () => { d.paragraphs.splice(i, 1); render(); paintPanel(); }, 'sm d')}</div></div>`).join('')
        + btn('+ Ajouter un paragraphe', () => { (d.paragraphs = d.paragraphs || []).push(''); render(); paintPanel(); })
        + (b.kind === 'feature' ? `<h4>Image</h4>` +
          sel('Média affiché', d.mediaId || '', [['', '— aucun —']].concat(D.media.map(m => [m.id, m.title || m.id])), v => { d.mediaId = v; render(); })
          + sel('Format', d.ratio || 'r43', [['r43', 'Paysage'], ['r11', 'Carré'], ['r34', 'Portrait'], ['r169', 'Large'], ['r916', 'Vertical']], v => { d.ratio = v; render(); })
          : '');
    case 'gallery':
      return sel('Album affiché', d.album || '', [['', 'Tous']].concat([...new Set(D.media.map(m => m.album).filter(Boolean))].map(a => [a, a])), v => { d.album = v; render(); })
        + sel('Colonnes', d.columns || 3, [2, 3, 4], v => { d.columns = Number(v); render(); });
    case 'releases': case 'artists': case 'products':
      return f('Nombre maximum affiché', d.limit, v => { d.limit = Number(v) || 100; render(); }, 'number');
    case 'ticker':
      return `<h4>Messages du fil</h4>` + (d.items || []).map((it, i) => `<div class="ed-item">
          ${f('Étiquette', it.tag, v => { it.tag = v; render(); })}
          ${f('Texte', it.text, v => { it.text = v; render(); })}
          ${f('Lien', it.url, v => { it.url = v; render(); })}
          ${btn('Supprimer', () => { d.items.splice(i, 1); render(); paintPanel(); }, 'sm d')}</div>`).join('')
        + btn('+ Ajouter un message', () => { (d.items = d.items || []).push({ tag: '', text: '', url: '' }); render(); paintPanel(); })
        + f('Durée d’un tour, en secondes', d.speed || 40, v => { d.speed = Number(v) || 40; render(); }, 'number');
    case 'news':
      return f('Nombre d’actus affichées', d.limit, v => { d.limit = Number(v) || 3; render(); }, 'number')
        + f('Lien « toutes les actualités »', d.moreUrl, v => { d.moreUrl = v; render(); })
        + chk('Mettre la première en avant', d.featureFirst !== false, v => { d.featureFirst = v; render(); });
    case 'spotlight':
      return f('Petite étiquette', d.kicker, v => { d.kicker = v; render(); })
        + sel('Image de fond', d.mediaId || '', [['', '— aucune —']].concat(D.media.map(m => [m.id, m.title || m.id])), v => { d.mediaId = v; render(); })
        + `<h4>Boutons</h4>` + (d.actions || []).map((a, i) => `<div class="ed-item">
            ${f('Texte', a.label, v => { a.label = v; render(); })}${f('Adresse', a.url, v => { a.url = v; render(); })}
            ${btn('Supprimer', () => { d.actions.splice(i, 1); render(); paintPanel(); }, 'sm d')}</div>`).join('')
        + btn('+ Ajouter un bouton', () => { (d.actions = d.actions || []).push({ label: '', url: '' }); render(); paintPanel(); });
    case 'quote':
      return `<div class="ed-note">Le texte et la signature se modifient directement sur la page.</div>`;
    case 'showcase':
      return sel('Contenu du carrousel', d.source || 'media',
          [['media', 'Médias'], ['artists', 'Artistes'], ['releases', 'Sorties'], ['products', 'Produits']],
          v => { d.source = v; render(); })
        + (d.source === 'media' || !d.source
          ? sel('Album', d.album || '', [['', 'Tous']].concat([...new Set(D.media.map(m => m.album).filter(Boolean))].map(a => [a, a])), v => { d.album = v; render(); })
          : '');
    case 'namelist': case 'shopgrid':
      return `<div class="ed-note">Ce bloc se remplit tout seul. Gère son contenu dans l’onglet correspondant.</div>`;
    case 'contactform':
      return `<h4>Objets proposés</h4>` + f('Un objet par ligne', (d.subjects || []).join('\n'),
        v => { d.subjects = v.split('\n').map(s => s.trim()).filter(Boolean); render(); }, 'textarea');
    case 'marquee':
      return f('Mots défilants, un par ligne', (d.items || []).join('\n'),
        v => { d.items = v.split('\n').map(s => s.trim()).filter(Boolean); render(); }, 'textarea');
    default: return '';
  }
}

/* ── comptes éditeurs ─────────────────────────────────────
   Les codes ne sont pas stockés en clair : seule leur empreinte
   l'est. Quelqu'un qui ouvre le fichier ne peut donc pas les lire.
   Ça reste une porte, pas un coffre-fort : sans serveur, personne
   ne peut empêcher un informaticien de contourner la vérification.
   ─────────────────────────────────────────────────────────── */
async function hashCode(salt, code) {
  const txt = salt + ':' + code;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 0;
  for (let i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) | 0;
  return 'x' + (h >>> 0).toString(16);
}
const rndSalt = () => [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2, '0')).join('');

let CURRENT_EDITOR = null;
let gateTries = 0, gateLockedUntil = 0;

function enterEdit() {
  const list = (D.editors || []).filter(e => e.active);
  if (!list.length) return reallyEnterEdit();
  if (CURRENT_EDITOR) return reallyEnterEdit();
  openGate(list);
}

function openGate(list) {
  const g = $('#edGate');
  g.style.display = 'grid';
  g.innerHTML = `<div class="bx">
    <h3>Espace éditeur</h3>
    <p>Choisis ton nom, puis entre ton code d’accès.</p>
    <div class="ed-f"><label>Qui es-tu ?</label>
      <select id="gateWho">${list.map(e =>
        `<option value="${esc(e.id)}">${esc(e.name)}${e.role === 'principal' ? ' (principal)' : ''}</option>`).join('')}</select></div>
    <div class="ed-f"><label>Code d’accès</label>
      <input id="gateCode" type="password" autocomplete="off" placeholder="XXXX-0000"></div>
    <p class="msg bad" id="gateMsg" style="min-height:1em;margin:4px 0 12px"></p>
    <div class="ed-row"><button class="ed-b p" id="gateOk">Entrer</button>
    <button class="ed-b" id="gateCancel">Annuler</button></div>
    <p style="font-size:.72rem;margin:14px 0 0"><a href="#" id="gateLost"
      style="color:#a8a6a1;text-decoration:underline">Code d’accès perdu ?</a></p>
    <p style="font-size:.68rem;color:#75736e;margin:8px 0 0;line-height:1.5">
      Ton nom sera inscrit à chaque enregistrement.</p>
  </div>`;

  const msg = $('#gateMsg'), input = $('#gateCode');
  input.focus();

  const submit = async () => {
    const now = Date.now();
    if (now < gateLockedUntil) {
      msg.textContent = `Trop d’essais. Réessaie dans ${Math.ceil((gateLockedUntil - now) / 1000)} secondes.`;
      return;
    }
    const who = (D.editors || []).find(e => e.id === $('#gateWho').value);
    if (!who) { msg.textContent = 'Compte introuvable.'; return; }
    const h = await hashCode(who.salt, input.value.trim());
    if (h !== who.hash) {
      gateTries++;
      if (gateTries >= 5) { gateLockedUntil = Date.now() + 60000; gateTries = 0; msg.textContent = 'Trop d’essais. Attends une minute.'; }
      else msg.textContent = `Code incorrect. ${5 - gateTries} essai${5 - gateTries > 1 ? 's' : ''} restant${5 - gateTries > 1 ? 's' : ''}.`;
      input.select();
      return;
    }
    gateTries = 0;
    CURRENT_EDITOR = who;
    EDITOR_NAME = who.name;
    g.style.display = 'none';
    reallyEnterEdit();
    toast(`Bonjour ${who.name.split(' ')[0]}.`);
  };

  $('#gateOk').onclick = submit;
  $('#gateCancel').onclick = () => { g.style.display = 'none'; };
  $('#gateLost').onclick = e => { e.preventDefault(); openRecovery(list); };
  input.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/** Code d'accès perdu : on le rétablit avec le code de secours reçu au départ. */
function openRecovery(list) {
  const g = $('#edGate');
  g.innerHTML = `<div class="bx">
    <h3>Code d’accès perdu</h3>
    <p>Utilise le code de secours à seize caractères qui t’a été remis. Il ne sert qu’une fois :
    un nouveau te sera donné juste après.</p>
    <div class="ed-f"><label>Qui es-tu ?</label>
      <select id="recWho">${list.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div>
    <div class="ed-f"><label>Code de secours</label>
      <input id="recCode" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX"></div>
    <div class="ed-f"><label>Nouveau code d’accès</label>
      <input id="recNew" type="password" autocomplete="off" placeholder="six caractères minimum"></div>
    <p class="msg bad" id="recMsg" style="min-height:1em;margin:4px 0 12px"></p>
    <div class="ed-row"><button class="ed-b p" id="recOk">Rétablir</button>
    <button class="ed-b" id="recBack">Retour</button></div>
  </div>`;

  $('#recBack').onclick = () => openGate(list);
  $('#recOk').onclick = async () => {
    const who = (D.editors || []).find(e => e.id === $('#recWho').value);
    const msg = $('#recMsg');
    const given = $('#recCode').value.trim().toUpperCase();
    const neuf = $('#recNew').value.trim();
    if (!who || !who.recHash) { msg.textContent = 'Aucun code de secours n’est enregistré pour ce compte. Demande à l’éditeur principal de t’en attribuer un nouveau.'; return; }
    if (neuf.length < 6) { msg.textContent = 'Le nouveau code doit faire au moins six caractères.'; return; }
    const h = await hashCode(who.recSalt, given);
    if (h !== who.recHash) { msg.textContent = 'Code de secours incorrect.'; return; }

    who.salt = rndSalt();
    who.hash = await hashCode(who.salt, neuf);
    const suivant = newRecoveryCode();
    who.recSalt = rndSalt();
    who.recHash = await hashCode(who.recSalt, suivant);

    CURRENT_EDITOR = who; EDITOR_NAME = who.name;
    g.style.display = 'none';
    setDirty(true);
    reallyEnterEdit();
    alert(`Code d’accès rétabli pour ${who.name}.\n\n` +
      `NOUVEAU CODE DE SECOURS, note-le maintenant :\n\n${suivant}\n\n` +
      `Important : ${syncOn() ? 'clique sur Publier' : 'enregistre le fichier et repartage-le'}, ` +
      `sinon l’ancien code restera en vigueur.`);
  };
  $('#recCode').focus();
}

function newRecoveryCode() {
  const AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const raw = [...crypto.getRandomValues(new Uint8Array(16))].map(x => AL[x % AL.length]).join('');
  return raw.match(/.{1,4}/g).join('-');
}

/* ════════════════════════════════════════════════════════════
   TRAVAIL À PLUSIEURS
   Le fichier étant la base de données, on ne peut pas éditer
   à deux en même temps. On rend donc visible QUI a modifié QUOI
   et QUAND, et on permet de n'échanger qu'une rubrique à la fois.
   ════════════════════════════════════════════════════════════ */

let PENDING_IMPORT = null;

/** Rubriques échangeables séparément. */
const PARTS = {
  news:     { label: 'Actualités',        keys: ['news'] },
  artists:  { label: 'Artistes',          keys: ['artists'] },
  releases: { label: 'Sorties',           keys: ['releases'] },
  media:    { label: 'Médias',            keys: ['media'] },
  shop:     { label: 'Boutique',          keys: ['products', 'shop'] },
  pages:    { label: 'Textes et pages',   keys: ['pages', 'nav'] },
  look:     { label: 'Apparence',         keys: ['theme'] },

};

const stamp = () => {
  const m = D.meta || (D.meta = {});
  return { v: m.version || 1, who: m.lastEditor || '', when: m.lastSaved || '' };
};
const frStamp = () => {
  const s = stamp();
  const dt = s.when ? new Date(s.when).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '—';
  return `Version ${s.v}${s.who ? `, par ${s.who}` : ''}${s.when ? `, le ${dt}` : ''}`;
};

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportPart(key) {
  const part = PARTS[key];
  const data = {};
  part.keys.forEach(k => data[k] = D[k]);
  download(`vibes-${key}.json`, JSON.stringify({
    _vibes: 'rubrique', part: key, label: part.label,
    version: (D.meta.version || 1), editor: EDITOR_NAME || D.meta.lastEditor || '',
    date: new Date().toISOString(), data
  }, null, 1));
  toast(`Rubrique « ${part.label} » exportée.`);
}

/** Lit un fichier reçu : soit une rubrique .json, soit un site .html complet. */
function readIncoming(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const txt = String(fr.result);
    try {
      if (/\.json$/i.test(file.name)) {
        const j = JSON.parse(txt);
        if (j._vibes !== 'rubrique') throw new Error('Ce fichier n’est pas une rubrique VIBES.');
        PENDING_IMPORT = { kind: 'part', key: j.part, label: j.label || PARTS[j.part]?.label || j.part,
          version: j.version, editor: j.editor, date: j.date, data: j.data };
      } else {
        const m = txt.match(/<script id="site-data"[^>]*>([\s\S]*?)<\/script>/);
        if (!m) throw new Error('Ce fichier HTML ne contient pas de site VIBES.');
        const j = JSON.parse(m[1]);
        PENDING_IMPORT = { kind: 'site', data: j, version: (j.meta || {}).version || 1,
          editor: (j.meta || {}).lastEditor || '', date: (j.meta || {}).lastSaved || '' };
      }
      paintPanel();
    } catch (e) { alert('Import impossible : ' + e.message); }
  };
  fr.readAsText(file);
}

function applyImport(keys) {
  const imp = PENDING_IMPORT;
  if (!imp) return;
  const src = imp.kind === 'part' ? imp.data : imp.data;
  keys.forEach(k => {
    (PARTS[k] ? PARTS[k].keys : [k]).forEach(field => {
      if (src[field] !== undefined) D[field] = src[field];
    });
  });
  PENDING_IMPORT = null;
  setDirty(true);
  render(); paintPanel();
  toast('Import appliqué. Vérifie, puis enregistre.');
}

function tabPartage() {
  const s = stamp();

  if (PENDING_IMPORT) {
    const imp = PENDING_IMPORT;
    const older = imp.version && imp.version < s.v;
    const dt = imp.date ? new Date(imp.date).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '—';
    if (imp.kind === 'part') {
      return `<div class="ed-note">Fichier reçu : rubrique <b>${esc(imp.label)}</b><br>
        Version ${imp.version || '?'}${imp.editor ? `, par ${esc(imp.editor)}` : ''}, le ${dt}.<br>
        Ton fichier actuel : ${esc(frStamp())}.</div>
        ${older ? `<div class="ed-note"><b>Attention.</b> Ce fichier vient d’une version plus ancienne que la tienne.
          Si ton ami travaillait sur une copie dépassée, tu vas perdre ce que tu as fait depuis dans cette rubrique.</div>` : ''}
        <div class="ed-row">${btn('Remplacer ma rubrique « ' + imp.label + ' »', () => applyImport([imp.key]), 'p')}
        ${btn('Annuler', () => { PENDING_IMPORT = null; paintPanel(); })}</div>`;
    }
    return `<div class="ed-note">Site complet reçu.<br>
      Version ${imp.version}${imp.editor ? `, par ${esc(imp.editor)}` : ''}, le ${dt}.<br>
      Ton fichier actuel : ${esc(frStamp())}.</div>
      ${older ? `<div class="ed-note"><b>Attention.</b> Le fichier reçu est plus ancien que le tien.</div>` : ''}
      <h4>Que veux-tu reprendre ?</h4>
      ${Object.entries(PARTS).map(([k, v]) => btn(v.label, () => applyImport([k]), 'sm')).join(' ')}
      <div style="margin-top:14px">${btn('Tout remplacer', () => {
        if (confirm('Remplacer l’intégralité de ton site par le fichier reçu ?')) applyImport(Object.keys(PARTS));
      }, 'd')}
      ${btn('Annuler', () => { PENDING_IMPORT = null; paintPanel(); })}</div>`;
  }

  return `<div class="ed-note"><b>${esc(frStamp())}</b><br>
    Le numéro de version augmente à chaque enregistrement. C’est lui qui dit qui a la version la plus récente.</div>
    <div class="ed-note">Connecté en tant que <b>${esc(CURRENT_EDITOR ? CURRENT_EDITOR.name : 'invité')}</b>${
      CURRENT_EDITOR && CURRENT_EDITOR.role === 'principal' ? ' (éditeur principal)' : ''}.
      Ce nom est inscrit automatiquement à chaque enregistrement.</div>
    ${CURRENT_EDITOR ? btn('Se déconnecter', () => signOut()) : ''}

    <h4>La règle</h4>
    <div class="ed-note">Une seule personne modifie le fichier à la fois. Celui qui édite prévient l’autre,
    enregistre, puis repartage le fichier. Sans ça, le dernier qui enregistre écrase le travail du premier.</div>

    <h4>Envoyer une rubrique à ton ami</h4>
    <div class="ed-note">Plus sûr que d’échanger tout le site : il ne recevra que cette partie,
    et le reste de ton travail ne risque rien.</div>
    ${Object.entries(PARTS).map(([k, v]) => btn(v.label, () => exportPart(k), 'sm')).join(' ')}

    <h4>Recevoir un fichier</h4>
    <div class="ed-note">Accepte une rubrique (.json) ou un site complet (.html). Je te dirai d’où il vient
    et ce qu’il va remplacer avant d’appliquer quoi que ce soit.</div>
    ${btn('Choisir un fichier reçu', () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,.html';
      inp.onchange = () => { if (inp.files[0]) readIncoming(inp.files[0]); };
      inp.click();
    }, 'p')}

    <h4>Sauvegarde du fichier</h4>
    <div class="ed-note">${syncOn()
      ? 'Le site est branché en ligne : le bouton Publier suffit. Télécharge quand même le fichier de temps en temps, c’est ta copie de secours.'
      : 'Le contenu vit dans le fichier. Chaque enregistrement télécharge une nouvelle version qui remplace l’ancienne.'}</div>
    ${btn('Télécharger le fichier', () => save())}

    <h4>Comptes éditeurs</h4>
    <div class="ed-note">Chacun a son nom et son code. Les codes ne sont pas écrits en clair dans le fichier,
    seule leur empreinte l’est. <b>Ce n’est pas un coffre-fort</b> : sans serveur, un informaticien peut
    contourner la porte. C’est fait pour empêcher un visiteur d’entrer, pas un spécialiste.</div>
    ${(D.editors || []).map(e => `<div class="ed-item"><div class="t">
        <b>${esc(e.name)}</b><span class="k">${e.role === 'principal' ? 'principal' : 'éditeur'}${e.active ? '' : ' · désactivé'}</span>
        ${CURRENT_EDITOR && CURRENT_EDITOR.id === e.id ? btn('Changer mon code', () => askNewCode(e), 'sm') : ''}
        ${CURRENT_EDITOR && CURRENT_EDITOR.role === 'principal' && CURRENT_EDITOR.id !== e.id
          ? btn(e.role === 'principal' ? 'Repasser éditeur' : 'Passer principal', () => {
              if (e.role === 'principal' && lastPrincipal(e)) { alert('Il doit rester au moins un éditeur principal.'); return; }
              e.role = e.role === 'principal' ? 'editeur' : 'principal';
              setDirty(true); paintPanel();
            }, 'sm')
            + btn(e.active ? 'Désactiver' : 'Réactiver', () => {
              if (e.active && e.role === 'principal' && lastPrincipal(e)) { alert('Il doit rester au moins un éditeur principal actif.'); return; }
              e.active = !e.active; setDirty(true); paintPanel();
            }, 'sm')
            + btn('Nouveau code', () => askNewCode(e), 'sm')
            + btn('Code de secours', () => askNewRecovery(e), 'sm')
            + btn('✕', () => {
              if (e.role === 'principal' && lastPrincipal(e)) { alert('Il doit rester au moins un éditeur principal.'); return; }
              if (confirm(`Retirer ${e.name} de la liste ?`)) { D.editors = D.editors.filter(x => x.id !== e.id); setDirty(true); paintPanel(); }
            }, 'sm d')
          : ''}
      </div></div>`).join('')}
    ${CURRENT_EDITOR && CURRENT_EDITOR.role === 'principal'
      ? btn('+ Ajouter une personne', () => addEditor(), 'p')
      : `<div class="ed-note">Seul l’éditeur principal peut ajouter ou retirer quelqu’un.</div>`}

    <h4>Travailler vraiment à deux en même temps</h4>
    <div class="ed-note">Impossible avec un fichier seul : il faudrait un serveur qui garde la version de
    référence. C’est ce que fait le projet complet livré plus tôt. Dis-le-moi si vous devenez plusieurs à
    écrire régulièrement.</div>`;
}

/** Vrai si `e` est le dernier éditeur principal actif : on ne peut alors ni le
    rétrograder, ni le désactiver, ni le supprimer, sous peine de bloquer tout le monde. */
function lastPrincipal(e) {
  const principaux = (D.editors || []).filter(x => x.role === 'principal' && x.active);
  return principaux.length <= 1 && principaux.some(x => x.id === e.id);
}

async function askNewRecovery(e) {
  const c = newRecoveryCode();
  e.recSalt = rndSalt();
  e.recHash = await hashCode(e.recSalt, c);
  setDirty(true);
  paintPanel();
  alert(`Nouveau code de secours pour ${e.name}, à lui transmettre et à conserver :\n\n${c}\n\n` +
    `Il ne sera plus jamais affiché. Pense à ${syncOn() ? 'publier' : 'enregistrer le fichier'}.`);
}

async function askNewCode(e) {
  const c = prompt(`Nouveau code d’accès pour ${e.name} :`);
  if (c == null) return;
  const code = c.trim();
  if (code.length < 6) { alert('Le code doit faire au moins six caractères.'); return; }
  e.salt = rndSalt();
  e.hash = await hashCode(e.salt, code);
  setDirty(true);
  paintPanel();
  alert(`Code enregistré pour ${e.name} :\n\n${code}\n\nTransmets-le-lui autrement que par le fichier, puis enregistre le site.`);
}

async function addEditor() {
  const name = prompt('Nom complet de la personne :');
  if (!name || !name.trim()) return;
  const code = prompt(`Code d’accès pour ${name.trim()} (six caractères minimum) :`);
  if (!code || code.trim().length < 6) { alert('Code trop court, rien n’a été créé.'); return; }
  const salt = rndSalt();
  D.editors = D.editors || [];
  D.editors.push({ id: uid('ed'), name: name.trim(), role: 'editeur', salt,
    hash: await hashCode(salt, code.trim()), active: true });
  setDirty(true);
  paintPanel();
  alert(`${name.trim()} peut maintenant entrer avec le code :\n\n${code.trim()}\n\nN’oublie pas d’enregistrer le site.`);
}

/* ── démarrage, une fois tout le code défini ──────────────── */
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', () => { collectParallax(); onScroll(); }, { passive: true });
setupCursor();
bindEgg();

render();

/* Le contenu du fichier s'affiche tout de suite, puis on va chercher
   la version en ligne si elle existe. Pas d'écran blanc en cas de coupure. */
(async () => {
  if (syncOn()) {
    const ok = await loadRemote({ silent: true });
    if (ok) { render(); if (EDIT) paintPanel(); }
  }
  if (/(^|#|&)edition/.test(location.hash)) enterEdit();
})();

</script>
